apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
  namespace: logging-hw
spec:
  selector:
    matchLabels:
      app: log-agent
  template:
    metadata:
      labels:
        app: log-agent
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: log-agent
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - sh
            - -c
            - |
              echo "log-agent started on node ${NODE_NAME}"
              while true; do
                found=0
                for f in /var/log/containers/*custom-app*.log; do
                  if [ -e "$f" ]; then
                    found=1
                    echo "===== $(date) $f ====="
                    grep "APP_LOGFILE" "$f" | tail -n 30 || echo "No APP_LOGFILE lines yet in $f"
                  fi
                done
                if [ "$found" -eq 0 ]; then
                  echo "No custom-app logs found yet"
                fi
                sleep 20
              done
          volumeMounts:
            - name: varlogcontainers
              mountPath: /var/log/containers
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
            type: Directory
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory